<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>UI theme sampling test</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f3f5f8; color: #20242c; font: 16px/1.6 system-ui, sans-serif; }
    header { display: block; height: 64px; padding: 18px 28px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #dce2ea; color: #20242c; }
    main { display: grid; grid-template-columns: minmax(0, 720px) 1fr; gap: 24px; padding: 28px; }
    .video-stage { background: #111827; border-radius: 12px; overflow: hidden; min-height: 400px; }
    video { display: block; width: 100%; height: 400px; background: #05070b; }
    .side { background: #ffffff; border: 1px solid #dce2ea; border-radius: 12px; padding: 20px; color: #3b4350; }
  </style>
</head>
<body>
  <header><strong>Light page UI</strong> — the video below is intentionally dark.</header>
  <main>
    <div class="video-stage"><video id="demoVideo" controls src="audio.wav"></video></div>
    <aside class="side">The extension UI should stay light because the page UI is light, regardless of the dark video stage.</aside>
  </main>
</body>
</html>
