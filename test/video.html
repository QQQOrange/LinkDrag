<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>视频总结测试</title>
  <style>
    body { margin: 0; padding: 40px; font: 16px/1.7 system-ui, "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #222; }
    h1 { font-size: 24px; }
    .video-wrap { width: 700px; max-width: 100%; margin-top: 24px; }
    video { display: block; width: 700px; max-width: 100%; height: 394px; background: #172033; border-radius: 12px; }
    p { max-width: 700px; color: #666; }
  </style>
</head>
<body>
  <h1>视频一键总结测试</h1>
  <p>把鼠标移到下面的视频上，视频右上角会出现「AI 总结」按钮。</p>
  <div class="video-wrap">
    <video id="demoVideo" controls poster="thumb.png" preload="metadata">
      <track kind="captions" src="captions.vtt" srclang="zh" label="中文" default>
    </video>
  </div>
</body>
</html>
