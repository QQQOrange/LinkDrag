<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Dark UI theme sampling test</title>
  <style>
    html, body { margin: 0; padding: 0; background: #161a21; color: #e8edf5; font: 16px/1.6 system-ui, sans-serif; }
    header { display: block; height: 64px; padding: 18px 28px; box-sizing: border-box; background: #1e2530; border-bottom: 1px solid #354050; color: #f2f6fb; }
    main { padding: 28px; }
    .video-stage { background: #f4f6fa; border-radius: 12px; overflow: hidden; }
    video { display: block; width: 720px; height: 400px; background: #e8edf5; }
  </style>
</head>
<body>
  <header><strong>Dark page UI</strong> — the video stage is intentionally light.</header>
  <main><div class="video-stage"><video id="demoVideo" controls src="audio.wav"></video></div></main>
</body>
</html>
