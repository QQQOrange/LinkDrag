<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>真实视频下载验收</title>
  <style>
    body { margin: 0; padding: 32px; font: 15px/1.7 system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; }
    video { display: block; width: 640px; max-width: 100%; height: 340px; background: #101522; border-radius: 12px; }
    #state { margin-top: 12px; color: #4a5568; font: 12px/1.6 ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>真实视频下载验收</h1>
  <p>播放器直接使用公开 MP4 直链，模拟最常见的「可下载」页面。</p>
  <video id="v" controls playsinline preload="metadata"
         src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
  <div id="state">loading…</div>
  <script>
    const v = document.getElementById('v');
    const out = document.getElementById('state');
    v.addEventListener('loadedmetadata', () => {
      out.textContent = 'metadata ok · ' + v.videoWidth + 'x' + v.videoHeight + ' · ' + Math.round(v.duration * 10) / 10 + 's';
    });
    v.addEventListener('error', () => { out.textContent = 'video error: ' + (v.error && v.error.code); });
  </script>
</body>
</html>
