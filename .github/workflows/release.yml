name: Release LinkDrag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension ZIP
        run: |
          cd extension
          zip -r "../LinkDrag-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: LinkDrag-*.zip
          generate_release_notes: true
          body: |
            LinkDrag first public release.

            - Link preview windows, image preview, reader mode and snapshots
            - AI page and media summaries with SRT subtitle export
            - Simplified Chinese and English UI
            - Douyin/YouTube/Bilibili media discovery improvements
